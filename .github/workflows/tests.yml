# Runs the test suite on every push and pull request.
#
# PyTorch is installed from its CPU-only package index first: the tests need
# no GPU, and the CPU build is a fraction of the size of the CUDA build.
# Two Python versions are tested: the oldest the project supports and a
# current one.

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run the tests
        run: pytest -q
