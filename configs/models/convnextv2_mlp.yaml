model:
  name: pixel_aligned_nerf
  encoder:
    name: convnextv2
    model_name: convnextv2_tiny.fcmae_ft_in22k_in1k
    pretrained: true
    num_features: 256
    input_normalization: imagenet
  decoder:
    name: pixelnerf_mlp
    hidden_width: 512
    num_frequencies: 6
    num_blocks: 5
    pool_after_block: 3
