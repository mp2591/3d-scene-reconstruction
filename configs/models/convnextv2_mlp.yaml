# ConvNeXt V2-T with the pixelNeRF-style MLP decoder.
#
# Both encoders of the ablation start from their authors' published
# self-supervised weights, learnt on ImageNet-1k without labels: FCMAE (a
# masked autoencoder) here, MAE for the Hiera-T weights of hiera_mlp.yaml.
# Neither has seen labels or more data than the other. Their pretraining
# recipes still differ (masking, length, augmentation), so the ablation
# compares each encoder as published, not the architectures alone.
# convnextv2_tiny.fcmae_ft_in22k_in1k, the same network fine-tuned with labels
# on ImageNet-22k and -1k, would be a separate run.

model:
  name: pixel_aligned_nerf
  encoder:
    name: convnextv2
    model_name: convnextv2_tiny.fcmae
    pretrained: true
    num_features: 256
    input_normalization: imagenet
  decoder:
    name: pixelnerf_mlp
    hidden_width: 512
    num_frequencies: 6
    num_blocks: 5
    pool_after_block: 3
