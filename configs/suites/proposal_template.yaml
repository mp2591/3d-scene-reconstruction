# TEMPLATE for the comparison in the project proposal. It does not run yet:
# the model files it names (configs/models/*.yaml) are written by the team,
# together with the networks they describe. Until they exist, `run-suite`
# stops before training anything and lists every missing file.
#
#   scene-recon run-suite --config configs/suites/proposal_template.yaml
#
# Try the whole suite quickly before the real run:
#
#   scene-recon run-suite --config configs/suites/proposal_template.yaml \
#       --set training.num_steps=200 training.validate_every=100 evaluation.num_scenes=5
#
# (Trial results land in the same directory; delete runs/proposal_comparison/
# before the real run, or change suite_name.)

suite_name: proposal_comparison
stages: [train, evaluate, profile]
# seeds: [0, 1, 2]   # optional: repeat every run per seed and report the spread

common:
  base: [../base.yaml, ../data/srn_cars.yaml]

# The first run is the reference: every other run is compared with it scene by scene.
runs:
  # (1) Baseline pixelNeRF: ResNet-34 encoder, MLP decoder with average pooling over views.
  pixelnerf_resnet34:
    base: ../models/pixelnerf_resnet34.yaml

  # (2) Baseline TransNeRF: U-Net encoder, cross-view and ray attention decoders.
  transnerf_unet:
    base: ../models/transnerf_unet.yaml

  # (3) Encoder ablations: the modern backbones with the same pixelNeRF-style
  #     decoder (pixelnerf_mlp), so that only the encoder differs.
  convnextv2_mlp:
    base: ../models/convnextv2_mlp.yaml   # ConvNeXt V2-T, pretrained weights via timm
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}   # pretrained weights; the new 1x1 adapter keeps the base rate

  hiera_mlp:
    base: ../models/hiera_mlp.yaml        # convnextv2_mlp with Hiera-T as the encoder; needs the
    optimization:                         # Hiera-T weights (docs/hiera_nerf.md)
      group_overrides:
        encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}

  # (4) End-to-end modernised model (issue #5): Hiera-T encoder with the HieraNeRF
  #     bridge and the Hiera-style attention decoder (docs/hiera_nerf.md). Like
  #     hiera_mlp, it needs the Hiera-T weights at weights/hiera_tiny_224_mae_in1k.pth;
  #     without them the suite stops before training anything.
  hiera_nerf:
    base: ../models/hiera_nerf.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}
