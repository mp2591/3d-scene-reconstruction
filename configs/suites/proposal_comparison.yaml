# The comparison of the project proposal, ready to run. Each run is one
# encoder-decoder combination. All runs are trained on the same data, one
# after another, with the same recipe, and scored the same way
# (docs/suites.md).
#
# The recipe is pixelNeRF's for ShapeNet-SRN (configs/base.yaml): 400,000
# steps of 4 scenes and 128 rays, the learning rate 1e-4 for every part of
# every model, two source views and rays from the box around the car for the
# first 300,000 steps, then one or two source views and the whole image. No
# model is tuned: the runs differ in the model alone, each encoder starting
# from its published pretrained weights. Scoring is pixelNeRF's benchmark:
# every view of every test scene that is not a source view.
# The baselines (pixelNeRF, TransNeRF) are trained here with the same recipe,
# not taken from their papers.
#
# Run it with scripts/run_comparison.sh, which does everything in order and
# can be left alone (docs/running_on_a_gpu_server.md):
#   1. a short trial of every run, in a folder of its own, and an estimate of
#      how long the rest takes on the machine;
#   2. this file, scored on the first 100 test scenes, so that every run has
#      results as early as possible;
#   3. this file again, scored on every test scene.
# scripts/run_comparison.sh can train another step budget (its second
# argument); it then replaces training.num_steps, optimization.decay_steps
# and training.first_phase_steps (three quarters of the budget, rounded up).
#
# Keep the outputs outside OneDrive, which would upload every checkpoint
# (several hundred MB, rewritten every 5,000 steps). If a trial of this file
# wrote into the real output folder, delete its proposal_comparison/
# directory first, or the real run resumes from the trial's checkpoints.
#
# Fixed once a run has trained: every setting that is not listed in
# CONTINUATION_SETTINGS in src/scene_recon/provenance.py, for example the
# seed, the training data and batch settings, the loss, the optimiser, every
# learning rate and its schedule, the renderer's sample counts and the model.
# Changing one means training the run again under a new name. Free to change
# later: training.num_steps, evaluation, validation and profiling.
#
# By hand, each command on one line:
#
#   scene-recon run-suite --config configs/suites/proposal_comparison.yaml --set experiment.output_dir=runs
#
# A quick try of this file alone, in a folder that can be deleted afterwards:
#
#   scene-recon run-suite --config configs/suites/proposal_comparison.yaml --set training.num_steps=200 training.validate_every=100 evaluation.num_scenes=5 experiment.output_dir=runs/trial
#
# The two baselines are commented out until the team adds their model files
# (configs/models/*.yaml) and the networks they describe; uncomment each one
# then. pixelnerf_resnet34 stays first, as the reference; until it exists the
# reference is convnextv2_mlp. transnerf_unet is listed last, so that
# uncommenting it first does not make it the reference.

suite_name: proposal_comparison
stages: [train, evaluate, profile]
# One seed for now. Listing it keeps every run in <run>/seed_0/, so that more
# seeds ([0, 1, 2]) can be added later without moving or retraining seed 0.
seeds: [0]

common:
  base: [../base.yaml, ../data/srn_cars.yaml]

# The first run is the reference: every other run is compared with it scene by scene.
runs:
  # (1) Baseline pixelNeRF: ResNet-34 encoder, MLP decoder with average pooling over views.
  #     Uncomment once configs/models/pixelnerf_resnet34.yaml exists.
  # pixelnerf_resnet34:
  #   base: ../models/pixelnerf_resnet34.yaml

  # (2) Encoder ablations: the modern backbones with the same pixelNeRF-style
  #     decoder (pixelnerf_mlp). The network differs only in the encoder.
  convnextv2_mlp:
    base: ../models/convnextv2_mlp.yaml   # ConvNeXt V2-T, pretrained weights via timm

  hiera_mlp:
    base: ../models/hiera_mlp.yaml        # convnextv2_mlp with Hiera-T as the encoder; needs the
                                          # Hiera-T weights (docs/hiera_nerf.md)

  # (3) End-to-end modernised model (issue #5): Hiera-T encoder with the HieraNeRF
  #     bridge and the Hiera-style attention decoder (docs/hiera_nerf.md). Like
  #     hiera_mlp, it needs the Hiera-T weights at weights/hiera_tiny_224_mae_in1k.pth;
  #     without them the suite stops before training anything.
  hiera_nerf:
    base: ../models/hiera_nerf.yaml

  # (4) Baseline TransNeRF: U-Net encoder, cross-view and ray attention decoders.
  #     It was built for 8 to 12 source views of real scenes; here it gets the
  #     same 1 or 2 views of SRN cars as every other model.
  #     Uncomment once configs/models/transnerf_unet.yaml exists.
  # transnerf_unet:
  #   base: ../models/transnerf_unet.yaml
