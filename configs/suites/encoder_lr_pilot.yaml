# Choosing each pretrained encoder's learning rate before the real comparison
# (proposal_comparison.yaml). Each model is trained briefly with the same
# three rates and scored on the validation split, never on the test split, so
# the choice cannot be fitted to the test scenes. Every model gets the same
# candidates, steps and data. Only the encoder's rate is tried; everything
# else learns at the base rate of base.yaml (1e-4), as in pixelNeRF.
#
#   scene-recon run-suite --config configs/suites/encoder_lr_pilot.yaml \
#       --set experiment.output_dir=<a folder outside OneDrive>
#
# About 16 hours on the RTX 4090: 13 of training (9 runs of 20,000 steps) and
# 3 of evaluation.
#
# How to choose, decided before running: for each model, take the rate with
# the highest PSNR averaged over the 1- and 2-view protocols (summary.md). If
# a lower rate is within 0.1 dB of it, take the lower one: it changes the
# pretrained weights less. Write the chosen rates into proposal_comparison.yaml.
# A baseline with a pretrained encoder, added later, gets the same three runs.
#
# 20,000 steps are 5% of the real run, so a rate that starts slowly may still
# win over 400,000 steps. The pilot ranks the rates; it does not predict the
# final scores.

suite_name: encoder_lr_pilot
stages: [train, evaluate]

common:
  base: [../base.yaml, ../data/srn_cars.yaml]
  data:
    test:
      split_dir: data/srn_cars/cars_val   # the validation split stands in for the test split
  training:
    num_steps: 20000
  evaluation:
    num_scenes: 100            # the first 100 of the 352 validation scenes
    num_target_views: 5        # evenly spread over each scene's views

runs:
  convnextv2_mlp_lr1e-5:
    base: ../models/convnextv2_mlp.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}
  convnextv2_mlp_lr3e-5:
    base: ../models/convnextv2_mlp.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 3.0e-5, warmup_steps: 2000}
  convnextv2_mlp_lr1e-4:
    base: ../models/convnextv2_mlp.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-4, warmup_steps: 2000}

  hiera_mlp_lr1e-5:
    base: ../models/hiera_mlp.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}
  hiera_mlp_lr3e-5:
    base: ../models/hiera_mlp.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 3.0e-5, warmup_steps: 2000}
  hiera_mlp_lr1e-4:
    base: ../models/hiera_mlp.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-4, warmup_steps: 2000}

  hiera_nerf_lr1e-5:
    base: ../models/hiera_nerf.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}
  hiera_nerf_lr3e-5:
    base: ../models/hiera_nerf.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 3.0e-5, warmup_steps: 2000}
  hiera_nerf_lr1e-4:
    base: ../models/hiera_nerf.yaml
    optimization:
      group_overrides:
        encoder: {learning_rate: 1.0e-4, warmup_steps: 2000}
