# Pipeline settings shared by all experiments, following the project proposal.
#
# This file is not runnable on its own: an experiment config adds the `data`
# and `model` sections (see smoke_test.yaml and srn_cars_tiny_model.yaml).
# Every setting the pipeline reads is listed here; there are no hidden
# defaults in the code.

experiment:
  run_name: unnamed         # Outputs go to <output_dir>/<run_name>/.
  output_dir: runs
  seed: 0
  device: auto              # "auto" = CUDA if available, else CPU. Or "cuda:1", "cpu", ...
  # How float32 matrix products are computed (torch.set_float32_matmul_precision).
  # "high" uses TensorFloat-32 on NVIDIA GPUs that have it (A100, RTX 30 and 40
  # series, H100 and GH200): 10 instead of 23 mantissa bits in the products,
  # sums still in float32, the usual choice for training. On an H100 such
  # products run several times faster than in full float32. Convolutions use
  # TensorFloat-32 in PyTorch already. "highest" = full float32; "medium" =
  # bfloat16. Part of how a run was trained and measured, so it is the same
  # for every run of a suite and cannot change for a trained run.
  float32_matmul_precision: high

loss:
  name: mse                 # Photometric MSE on the coarse and the fine render.

renderer:
  num_coarse_samples: 64    # Evenly spread samples per ray.
  num_fine_samples: 32      # Extra samples placed where the coarse pass found content. 0 = no fine pass.
  background_color: [1.0, 1.0, 1.0]   # ShapeNet-SRN renders have a white background.
  # Rays rendered at once for full images (evaluation, profiling). The same
  # for every run of a suite, because rendering speed depends on it. Memory
  # grows with it and with the number of source views: on an RTX 4090
  # (22.5 GB) at 128x128, 2048 rays with 3 source views needed about 5.3 GB
  # for each of convnextv2_mlp, hiera_mlp and hiera_nerf. At 8192 rays with
  # 2 views PyTorch reserved the whole GPU, the driver moved memory to main
  # memory and the frame rate fell by 60%; 16384 ran out of memory. Frame
  # rates between 1024 and 4096 differed by less than 4%.
  ray_chunk_size: 2048

optimization:
  optimizer: adam           # adam | adamw
  betas: [0.9, 0.999]
  weight_decay: 0.0
  learning_rate: 1.0e-4     # Applies to every parameter group unless overridden below.
  warmup_steps: 0
  # Exponential decay: the learning rate is multiplied by decay_rate every
  # decay_steps steps. The proposal does not fix these numbers yet; the values
  # below lower the learning rate tenfold over the course of training.
  decay_rate: 0.1
  decay_steps: 400000
  # Per parameter-group learning rate and warmup, keyed by group name. Example
  # for a model whose encoder is pretrained:
  #   group_overrides:
  #     encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}
  group_overrides: {}

training:
  num_steps: 400000
  batch_size: 4             # Scenes per step.
  rays_per_scene: 256       # batch_size * rays_per_scene = 1,024 rays per step, as in the proposal.
  views_per_scene: 8        # Views loaded per scene per step; sources and supervised rays come from these.
  num_source_views: [1, 2, 3]   # One of these is picked at random each step.
  # Processes that load batches while the GPU trains. On the RTX 4090
  # machine, with 4, a batch of SRN cars was ready every 6 ms, against 240 to
  # 310 ms per training step, so more would not train faster there. 0 = load
  # in the training process. The workers pass batches through /dev/shm, which
  # is checked before training starts. Changing it never changes what is
  # trained.
  num_workers: 4
  log_every: 100
  validate_every: 5000
  checkpoint_every: 5000

# Quick check on the validation split during training.
validation:
  num_scenes: 4
  num_target_views: 4
  source_views: [64]
  metrics: [psnr, ssim]

# Full protocol on the test split (`scene-recon evaluate`). One pass is run per
# entry of source_view_sets. [64] and [64, 104] are the 1- and 2-view inputs of
# the pixelNeRF benchmark; add a 3-view entry once its views are decided.
evaluation:
  source_view_sets: [[64], [64, 104]]
  metrics: [psnr, ssim, lpips]
  num_scenes: null          # null = every test scene.
  num_target_views: null    # null = every view that is not a source view.
  save_images: false        # Save every rendered view under <run_dir>/renders/ (large on the full test set).
  num_preview_scenes: 4     # Scenes whose first rendered view is always saved, for side-by-side comparisons.

# Rendering-speed measurement (`scene-recon profile`). Renders full frames of
# the first test scene, conditioned on the first entry of
# evaluation.source_view_sets.
profiling:
  num_frames: 20            # Timed frames; the reported speed is their average.
  num_warmup_frames: 2      # Untimed frames first, so start-up costs are not counted.
  # Share of the GPU's memory that must stay free while rendering (read after
  # each frame is queued and once all have run), or the speed is refused: a
  # full GPU can spill into main memory on Windows. On the
  # RTX 4090 (22.5 GB), two source views at 2048 rays per chunk left 15.1 GB
  # free; at 8192 nothing stayed free and the frame rate fell from 0.93 to 0.39.
  min_free_gpu_memory: 0.02
