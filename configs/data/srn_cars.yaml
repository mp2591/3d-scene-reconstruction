# ShapeNet-SRN Cars (Sitzmann et al., 2019), 128 x 128 renders.
#
# Point each split_dir at the extracted folder of that split. The source view
# indices in base.yaml (64 and 104) assume the benchmark's validation and test
# scenes with 251 views each; if your copy has fewer views per scene, change
# validation.source_views and evaluation.source_view_sets accordingly.
#
# near and far bound the distance from the camera at which a car can be.
#
# pixel_centers says how to read the principal point in the intrinsics files:
#   half_integer  as stored (the pipeline's own convention, pixel centres at i + 0.5)
#   integer       as the original SRN and pixelNeRF code reads them (centres at i);
#                 shifts the principal point by half a pixel. Matches the original
#                 rays exactly at the native 128x128 (see srn.py for resized images).
# integer is used, so that every model sees exactly the rays pixelNeRF casts.
# The choice is part of the training data: a run trained with one value must
# be trained again to change it. See the docstring of src/scene_recon/data/srn.py.

data:
  train:
    name: srn
    split_dir: data/srn_cars/cars_train
    near: 0.8
    far: 1.8
    pixel_centers: integer
  val:
    name: srn
    split_dir: data/srn_cars/cars_val
    near: 0.8
    far: 1.8
    pixel_centers: integer
  test:
    name: srn
    split_dir: data/srn_cars/cars_test
    near: 0.8
    far: 1.8
    pixel_centers: integer
