# Hiera-T + HieraNeRF on ShapeNet-SRN Cars.
#
#   scene-recon check-model --config configs/hiera_nerf_srn_cars.yaml
#   scene-recon train --config configs/hiera_nerf_srn_cars.yaml
#
# The model loads the Hiera-T weights from weights/hiera_tiny_224_mae_in1k.pth
# (set in models/hiera_nerf.yaml); docs/hiera_nerf.md says how to get them.

base:
  - base.yaml
  - data/srn_cars.yaml
  - models/hiera_nerf.yaml

experiment:
  run_name: hiera_nerf_srn_cars

optimization:
  # The encoder starts from pretrained weights; the adapter, the bridge and
  # the decoder start from scratch at the base learning rate.
  group_overrides:
    encoder: {learning_rate: 1.0e-5, warmup_steps: 2000}
